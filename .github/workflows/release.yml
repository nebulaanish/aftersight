name: release

# Merging to main publishes, but only when aftersight/__init__.py:__version__
# names a version PyPI does not already have. Every other merge builds, tests
# and then skips the upload, so no commit needs to know whether it is a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession would otherwise build and upload concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Token auth, because registering a trusted publisher needs a PyPI web
    # login that is currently unavailable. To move back to OIDC once it is:
    # register the publisher with owner nebulaanish, repository aftersight,
    # workflow release.yml and environment pypi, then drop the `with:` block
    # below and add `permissions: id-token: write` here.
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . build
      - run: python tests/test_formats.py
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # The version is already on PyPI: this merge did not bump it.
          skip-existing: true
