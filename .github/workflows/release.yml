name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Token auth, because registering a trusted publisher needs a PyPI web
    # login that is currently unavailable. To move back to OIDC once it is:
    # register the publisher with owner nebulaanish, repository aftersight,
    # workflow release.yml and environment pypi, then drop the `with:` block
    # below and add `permissions: id-token: write` here.
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . build
      - run: python tests/test_formats.py
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
