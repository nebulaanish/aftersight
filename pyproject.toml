[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aftersight"
version = "0.1.0"
description = "Local observability built for coding agents to inspect"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
# mkdocs 2.0 removes the plugin and theming systems that Material depends on.
docs = ["mkdocs-material>=9.5", "mkdocs<2"]

[project.scripts]
aftersight = "aftersight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aftersight"]
